name: rufus4mac
options:
  bundleIdPrefix: com.huconn
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  RufusPkg:
    path: .
targets:
  RufusApp:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Helper
        includes:
          - "com.huconn.rufus4mac.helper.plist"
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: RufusPkg
        product: DiskDiscovery
      - package: RufusPkg
        product: XPCProtocol
      - package: RufusPkg
        product: RufusCore
      - target: RufusHelper
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huconn.rufus4mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
  RufusHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes:
          - "com.huconn.rufus4mac.helper.plist"
    dependencies:
      - package: RufusPkg
        product: RufusCore
      - package: RufusPkg
        product: DiskDiscovery
      - package: RufusPkg
        product: XPCProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huconn.rufus4mac.helper
        SWIFT_VERSION: "6.0"
