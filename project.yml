name: rufus4mac
options:
  bundleIdPrefix: com.huconn
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  RufusPkg:
    path: .
targets:
  RufusApp:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: RufusPkg
        product: DiskDiscovery
      - package: RufusPkg
        product: RufusCore
      - package: RufusPkg
        product: WindowsMedia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huconn.rufus4mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "rufus4mac writes bootable images to removable USB drives, which requires access to removable volumes."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
